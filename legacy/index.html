<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHIS V2</title>
<style>
/* ============ GHIS V2 — minimal vanilla CSS ============ */
:root{--bg:#e9f0fb;--bg2:#f7faff;--panel:#fff;--line:#dbe4f0;--text:#1f2937;--muted:#6b7280;--primary:#04285c;--primary-2:#1f4c8d;--accent:#1e7f3f;--danger:#dc2626;--ok:#059669;--warn:#d97706;--side:#04285c;--side-2:#0b3a7a;--side-text:#c9d6ea;--radius:12px;--shadow:0 6px 20px rgba(4,40,92,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--bg2) 0%,var(--bg) 55%,#d9e6f8 100%);color:var(--text);font-size:14px}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;color:var(--text)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}button.primary:hover{background:var(--primary-2)}button.sm.primary{background:var(--accent);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:#fca5a5}button.sm{padding:4px 10px;font-size:12px}button:disabled{opacity:.6;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--text)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1 1 180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}th{background:#f8fafc;font-weight:600;font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#e0e7ff;color:#3730a3}.badge.off{background:#fee2e2;color:#991b1b}.badge.on{background:#d1fae5;color:#065f46}
.muted{color:var(--muted)}.right{text-align:left}.mt{margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
/* login — the ORIGINAL login-bg.jpg (panel, logo, title, icons, decorations are inside the image).
   #login-stage reproduces object-fit:cover / object-position:57.5% 50% in pure CSS, so every control is positioned
   in percentages of the IMAGE (x/1536, y/1024) and stays aligned on any viewport without JavaScript. */
#login-screen{position:fixed;inset:0;overflow:hidden;background:#dfe9f8;direction:rtl}
#login-stage{position:absolute;--w:max(100vw,150vh);--h:max(66.6667vw,100vh);width:var(--w);height:var(--h);left:calc((100vw - var(--w)) * .575);top:calc((100vh - var(--h)) * .5);font-size:calc(var(--w) / 76.8)}
#login-bg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#login-stage>input,#login-stage>button,#login-stage>a,#login-stage>div{position:absolute;margin:0;box-sizing:border-box;font-size:1em}
#lg-user{left:50.553%;top:49.775%;width:15.938%;height:4.219%}
#lg-pass{left:50.553%;top:56.260%;width:13.854%;height:4.219%}
#lg-eye{left:64.408%;top:56.104%;width:2.292%;height:4.531%}
#lg-btn{left:48.158%;top:63.447%;width:18.646%;height:5.156%}
#lg-forgot{left:53.053%;top:71.182%;width:8.854%;height:2.656%}
#lg-msg{left:48.158%;top:46.104%;width:18.646%;height:2.812%;font-size:.68em}
#login-stage input{background:#fff;border:0;border-radius:6px;outline:none;padding:0 .3em;direction:rtl;text-align:left;color:#1f2937;box-shadow:none;font-family:inherit;font-size:.8em}
#login-stage input::placeholder{color:#a9adb6}
#login-stage button,#login-stage a{background:transparent;border:0;border-radius:8px;padding:0;cursor:pointer;color:transparent;font-size:0;display:block}
#lg-btn:hover{background:rgba(255,255,255,.08)}#lg-btn:disabled{cursor:progress}#lg-eye:hover,#lg-forgot:hover{background:rgba(4,40,92,.05)}
#lg-msg{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;color:#dc2626;pointer-events:none}#lg-msg.good{color:#059669}#lg-msg.info{color:#4b5563}
/* shell */
#shell{display:flex;min-height:100vh}
#sidebar{width:230px;background:linear-gradient(180deg,var(--side) 0%,var(--side-2) 100%);color:var(--side-text);display:flex;flex-direction:column;flex-shrink:0}
#sidebar .brand{padding:18px 16px;font-weight:700;font-size:18px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
#sidebar .brand small{display:block;font-weight:400;font-size:11px;color:#64748b}
#nav{flex:1;padding:8px}#nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--side-text);text-decoration:none;margin-bottom:2px}
#nav a:hover{background:rgba(255,255,255,.08);color:#fff}#nav a.active{background:var(--accent);color:#fff}#nav a .ic{width:20px;text-align:center}
#userbox{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}#userbox b{display:block;color:#fff;font-size:13px}#userbox button{margin-top:8px;width:100%;background:transparent;color:var(--side-text);border-color:rgba(255,255,255,.25)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}#topbar h1{color:var(--primary)}
#topbar h1{margin:0;font-size:18px}#topbar .tools{display:flex;gap:8px;align-items:center}
#view{padding:22px;position:relative;flex:1}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 14px;color:var(--muted)}.tabs button.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:600}
/* loading + error (local to containers) */
.box{position:relative;min-height:60px}
.loader{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);z-index:5;border-radius:var(--radius)}
.spin{width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.err{border:1px solid #fca5a5;background:#fef2f2;color:#991b1b;border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.err small{display:block;color:#b91c1c;opacity:.8}
.inline-msg{font-size:12px;margin-top:8px;min-height:16px}.inline-msg.bad{color:var(--danger)}.inline-msg.good{color:var(--ok)}
/* toast */
#toast{position:fixed;bottom:18px;left:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
#toast div{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}#toast div.bad{background:var(--danger)}#toast div.good{background:var(--ok)}
/* perf panel */
#perf{position:fixed;top:8px;left:8px;z-index:98;background:#111827;color:#e5e7eb;font:11px/1.5 monospace;padding:10px;border-radius:8px;max-width:360px;max-height:70vh;overflow:auto;direction:ltr}
#perf table{background:transparent;color:inherit}#perf th,#perf td{padding:2px 6px;border-color:#374151;text-align:left}
.placeholder{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.perm-grid label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text)}.perm-grid input{width:auto}
@media (max-width:760px){#shell{flex-direction:column}#sidebar{width:100%;flex-direction:row;flex-wrap:wrap}#nav{display:flex;flex-wrap:wrap}#userbox{width:100%}#view{padding:12px}}
/* ---- Phase 1 additions (OLD GHIS sidebar groups, multi-select, print) ---- */
.nav-group{margin-bottom:6px}.nav-group-title{font-size:11px;color:#8fa6c8;padding:8px 12px 2px;letter-spacing:.3px}
#nav a{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px}
.sidebar-foot{padding:8px;border-top:1px solid rgba(255,255,255,.12)}.sidebar-foot a{display:block;padding:8px 12px;border-radius:8px;color:var(--side-text);text-decoration:none;font-size:13px}.sidebar-foot a:hover{background:rgba(255,255,255,.08);color:#fff}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.filters>div{min-width:160px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.profile-field{font-size:13px;padding:6px 8px;background:#f7faff;border-radius:6px}.profile-field b{color:var(--primary)}
.ms{position:relative}.ms-btn{width:100%;text-align:right;background:#fff;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-height:36px;font-size:13px}
.ms-pop{position:absolute;top:100%;right:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:220px;max-height:240px;overflow:auto;padding:6px}.ms-pop label{display:flex;gap:6px;align-items:center;padding:4px 6px;font-size:13px;color:var(--text);cursor:pointer}.ms-pop input{width:auto}
.clickable{cursor:pointer}.clickable:hover td{background:#f3f7fd}
.table-wrap{overflow:auto}
.ref-photo-box{display:flex;gap:14px;align-items:center;margin:12px 0;padding:10px;border:1px dashed var(--line);border-radius:8px}.ref-photo-thumb{width:96px;height:96px;object-fit:cover;border-radius:8px;background:#f1f5f9}.ref-photo-box.empty{color:#b45309;background:#fffbeb}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.status-line{font-size:13px;color:#555;margin:8px 0;min-height:16px}
.note{font-size:12px;color:#777}
#exportPrintArea{display:none}
/* ===== V1 print framework (منقول من GHIS V1: .report-doc / .report-table / @media print) ===== */
.report-doc{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);direction:rtl}
.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:14px;border-bottom:2.5px solid var(--primary)}
.report-brand-text strong{display:block;font-size:14.5px;color:var(--primary);font-weight:800}
.report-brand-text span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.report-head-date{text-align:left;font-size:9.5px;color:var(--muted);white-space:nowrap;line-height:1.6}
.report-head-date b{display:block;color:var(--text);font-size:10.5px}
.report-title-block{margin-bottom:14px}.report-title{font-size:19px;font-weight:800;color:var(--primary);margin:0 0 8px}
.report-subtitle-row{display:flex;flex-wrap:wrap;gap:6px}
.report-chip{display:inline-flex;align-items:center;gap:4px;background:#eef3fb;color:var(--primary);border:1px solid rgba(18,49,102,.14);border-radius:20px;padding:3.5px 12px;font-size:10.5px;font-weight:600}
.report-table-wrap{width:100%}
table.report-table{table-layout:fixed;width:100%;border-collapse:collapse;font-size:11px}
table.report-table thead{display:table-header-group}
table.report-table th{background:var(--primary);color:#fff;font-weight:700;padding:8px 7px;text-align:center;border:1px solid var(--primary-2);white-space:normal;word-break:normal;overflow-wrap:break-word;line-height:1.3}
table.report-table td{padding:6.5px 7px;text-align:center;border:1px solid #e4e7ee;color:var(--text);white-space:normal;word-break:normal;overflow-wrap:break-word;line-height:1.35}
table.report-table tbody tr:nth-child(even) td{background:#f7f8fb}
table.report-table tr{page-break-inside:avoid;break-inside:avoid}
table.report-table td[data-col="name"]{text-align:right}
.report-summary{margin-top:14px;padding:12px 14px;background:#eef3fb;border:1px solid rgba(18,49,102,.12);border-radius:var(--radius);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;page-break-inside:avoid;break-inside:avoid}
.report-summary-item{display:flex;justify-content:space-between;gap:8px;font-size:11px}
.report-empty-state{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.report-foot{margin-top:16px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted)}
@media print{
  body.printing-export > *:not(#exportPrintArea){display:none!important}
  body.printing-export #exportPrintArea{display:block!important;padding:0}
  table.report-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .report-summary{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .filters,.status-line,button,.tabs,#sidebar,#topbar,#toast,#perf,.pager,.form-actions,.inline-msg{display:none!important}
  body{padding:0;background:#fff}
}
</style>
</head>
<body>

<!-- LOGIN: the white panel, logo, title, icons and decorations are ALL inside login-bg.jpg. Only interactive controls are layered on top. -->
<div id="login-screen" class="hidden">
  <div id="login-stage">
    <img id="login-bg" src="login-bg.jpg" alt="" onerror="this.dataset.failed='1'">
    <div id="lg-msg" class="inline-msg"></div>
    <input id="lg-user" placeholder="اسم المستخدم" autocomplete="username">
    <input id="lg-pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="lg-eye" type="button" title="إظهار / إخفاء كلمة المرور">إظهار كلمة المرور</button>
    <button id="lg-btn" type="button">دخول</button>
    <a id="lg-forgot" href="#">نسيت كلمة المرور؟</a>
  </div>
</div>

<!-- SHELL -->
<div id="shell" class="hidden">
  <aside id="sidebar">
    <div class="brand">GHIS <small>نظام شئون العاملين</small></div>
    <nav id="nav"></nav>
    <div id="userbox"><b id="ub-name"></b><span id="ub-role"></span></div>
    <div class="sidebar-foot"><a href="#/account">حسابي</a><a href="#" id="ub-logout">خروج</a></div>
  </aside>
  <main>
    <header id="topbar"><h1 id="page-title"></h1><div class="tools"><span id="net" class="muted"></span><button id="perf-btn" class="sm hidden" title="Ctrl+Shift+P">⏱</button></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="toast"></div>
<div id="perf" class="hidden"></div>
<div id="exportPrintArea"></div>

<script>
/* =====================================================================
   GHIS V2 — index.html — PHASE 1 (FOUNDATION + COMPLETE EMPLOYEES) — OLD GHIS terminology & workflows
   Modules: CONFIG · PERF · APP(state) · API · UI · Loading · ErrorView · Screen · Session · NAV/Router
            · LoginAsset · Shell · MS(multi-select) · Pager · Export · Screens.* · boot
   ===================================================================== */
'use strict';

const CONFIG = { API_URL: '', TIMEOUT_MS: 30000, TOKEN_KEY: 'ghis2.token', BUILD: '2.4.0-phase4',
  SHEETJS_URL: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  EXCELJS_URL: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js' };   // نفس مكتبتي V1 بالظبط   // loaded lazily ONLY for Excel import/export

const PERF = {
  enabled: (() => { try { return /[?&]perf=1/.test(location.search) || localStorage.getItem('ghis2.perf') === '1'; } catch (e) { return false; } })(),
  marks: [], requests: [],
  mark(label, ms, extra) { if (this.enabled) this.marks.push({ label, ms: Math.round(ms), ...(extra || {}) }); },
  async time(label, fn) { if (!this.enabled) return fn(); const t = performance.now(); try { return await fn(); } finally { this.mark(label, performance.now() - t); } },
  report() {
    const reqRows = this.requests.map(r => `<tr><td>${r.action}</td><td>${r.ms}</td><td>${r.reads ?? '-'}</td><td>${r.writes ?? '-'}</td><td>${r.serverMs ?? '-'}</td><td>${r.ok ? 'ok' : r.code}</td></tr>`).join('');
    const markRows = this.marks.map(m => `<tr><td>${m.label}</td><td>${m.ms}</td><td colspan="4">${m.requests ?? ''}</td></tr>`).join('');
    return `<b>GHIS V2 PERF</b> — requests: ${this.requests.length}<table><tr><th>action</th><th>ms</th><th>reads</th><th>writes</th><th>srv ms</th><th>st</th></tr>${reqRows}</table><table class="mt"><tr><th>mark</th><th>ms</th><th colspan="4">req#</th></tr>${markRows}</table>`;
  }
};

/* ---------- CENTRAL STATE ---------- */
const COARSE_IMPLIES = { documents: ['docs_view', 'docs_add', 'docs_edit', 'docs_delete', 'docs_types_manage', 'docs_reports'], backup: ['backup_create', 'backup_restore', 'backup_upload', 'backup_view'], reports_export: ['employees_export', 'attendance_export', 'documents_export'] };
const APP = {
  session: null, user: null, sections: [], isAdmin: false, nameLists: { departments: [], jobTitles: [] }, settings: {},
  employees: { loaded: false, items: [], sync: { loaded: false, map: {} } }, profiles: {}, pending: {}, settingsData: {}, usersData: {},
  loading: {}, errors: {},
  /** UI mirror of the server's checkPermission_ (server remains the real guard) */
  can(key) { if (!key) return true; if (this.isAdmin) return true; if (this.sections.includes(key)) return true; for (const c in COARSE_IMPLIES) if (COARSE_IMPLIES[c].includes(key) && this.sections.includes(c)) return true; return false; }
};

/* ---------- API LAYER (single entry, consistent errors, timeout, classification) ---------- */
class ApiError extends Error { constructor(code, message, details) { super(message || code); this.code = code; this.details = details || null; } }
const API = {
  _transport(req) {
    if (window.google && google.script && google.script.run) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
    if (!CONFIG.API_URL) return Promise.reject(new ApiError('NETWORK_ERROR', 'لم يتم ضبط رابط الخادم (CONFIG.API_URL)'));
    return fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' }).then(r => r.json());
  },
  _classify(e) { if (e instanceof ApiError) return e; const msg = String(e && e.message || e || ''); if (!navigator.onLine) return new ApiError('NETWORK_ERROR', 'تعذّر الوصول للخادم — تأكد من اتصالك بالإنترنت وحاول تاني.'); if (/timeout|timed out/i.test(msg)) return new ApiError('TIMEOUT', 'انتهت مهلة الطلب'); if (/failed to fetch|networkerror|load failed/i.test(msg)) return new ApiError('NETWORK_ERROR', 'تعذّر الوصول للخادم — تأكد من اتصالك بالإنترنت وحاول تاني.'); return new ApiError('SERVER_ERROR', msg || 'خطأ غير متوقع'); },
  async call(action, payload, opts) {
    opts = opts || {}; const t = performance.now(); const rec = { action, ok: false }; if (PERF.enabled) PERF.requests.push(rec);
    const req = { action, token: APP.session ? APP.session.token : null, payload: payload || {} }; let timer;
    try {
      const res = await Promise.race([this._transport(req), new Promise((_, rej) => { timer = setTimeout(() => rej(new ApiError('TIMEOUT', 'انتهت مهلة الطلب')), opts.timeoutMs || CONFIG.TIMEOUT_MS); })]);
      if (!res || typeof res.ok !== 'boolean') throw new ApiError('SERVER_ERROR', 'استجابة غير صالحة من الخادم');
      if (res.meta) { rec.reads = res.meta.reads; rec.writes = res.meta.writes; rec.serverMs = res.meta.ms; }
      if (!res.ok) throw new ApiError(res.error.code, res.error.message, res.error.details);
      rec.ok = true; return res.data;
    } catch (e) { const err = this._classify(e); rec.code = err.code; if ((err.code === 'SESSION_EXPIRED' || (err.code === 'AUTH_ERROR' && action !== 'auth.login')) && APP.session) Session.expire(err.message); throw err; }
    finally { clearTimeout(timer); rec.ms = Math.round(performance.now() - t); }
  }
};

/* ---------- UI HELPERS ---------- */
const UI = {
  el(id) { return document.getElementById(id); },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  h(tag, attrs, children) { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (k === 'html') n.innerHTML = attrs[k]; else if (k === 'value') n.value = attrs[k]; else n.setAttribute(k, attrs[k]); } (children || []).forEach(c => { if (c === null || c === undefined || c === '') return; n.append(c instanceof Node ? c : document.createTextNode(String(c))); }); return n; },
  toast(msg, type) { const d = UI.h('div', { class: type || '' }, [msg]); UI.el('toast').append(d); setTimeout(() => d.remove(), 3500); },
  msg(el, text, type) { if (!el) return; el.textContent = text || ''; el.className = 'inline-msg ' + (type || ''); },
  card(title, children) { return UI.h('div', { class: 'card' }, [title ? UI.h('h3', {}, [title]) : '', ...(children || [])]); },
  field(label, input) { return UI.h('div', { class: 'field' }, [UI.h('label', {}, [label]), input]); },
  table(headers, rows, opts) { const t = UI.h('table', {}, [UI.h('thead', {}, [UI.h('tr', {}, headers.map(x => UI.h('th', {}, [x])))]), UI.h('tbody', {}, rows)]); return UI.h('div', { class: 'table-wrap' }, [t]); },

function togglePerf(force) { const p = UI.el('perf'); const show = force === undefined ? p.classList.contains('hidden') : force; p.classList.toggle('hidden', !show); if (show) p.innerHTML = PERF.report() + '<div style="margin-top:6px"><button class="sm" onclick="togglePerf(false)">close</button></div>'; }
async function doLogin() {
  const btn = UI.el('lg-btn'), msg = UI.el('lg-msg'); const u = UI.el('lg-user').value.trim(), p = UI.el('lg-pass').value;
  if (!u || !p) return UI.msg(msg, 'اكتب اسم المستخدم وكلمة المرور', 'bad');
  btn.disabled = true; UI.msg(msg, 'جاري الدخول...');
  try { await PERF.time('login+bootstrap', () => Session.login(u, p)); UI.msg(msg, ''); Shell.showApp({ id: 'reports', params: '' }); }
  catch (e) { UI.msg(msg, e.message, 'bad'); } finally { btn.disabled = false; }
}
(async function boot() {
  UI.el('lg-btn').addEventListener('click', doLogin);

  UI.el('lg-user').addEventListener('keydown', e => { if (e.key === 'Enter') UI.el('lg-pass').focus(); });
