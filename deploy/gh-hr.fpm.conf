; GHIS HR — dedicated PHP-FPM pool. Installed as /etc/php/8.3/fpm/pool.d/gh-hr.conf
[gh-hr]
user = tarek
group = tarek
listen = /run/php/php8.3-fpm-gh-hr.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 120s
security.limit_extensions = .php
clear_env = yes

php_admin_value[open_basedir] = /home/tarek/web/greenheights.edu.eg/hr-system:/home/tarek/tmp
; Temp files, uploads and sessions stay inside hr-system/storage, never in the shared /home/tarek/tmp.
php_admin_value[upload_tmp_dir] = /home/tarek/web/greenheights.edu.eg/hr-system/storage/tmp
php_admin_value[sys_temp_dir] = /home/tarek/web/greenheights.edu.eg/hr-system/storage/tmp
php_admin_value[session.save_path] = /home/tarek/web/greenheights.edu.eg/hr-system/storage/sessions
php_admin_value[error_log] = /home/tarek/web/greenheights.edu.eg/hr-system/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[file_uploads] = on
php_admin_value[upload_max_filesize] = 5M
php_admin_value[max_file_uploads] = 1
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,putenv,mail
php_admin_value[post_max_size] = 8M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
; Cookie flags (Secure, HttpOnly, SameSite=Strict, path=/hr/) and session strict mode are set by the app itself.
